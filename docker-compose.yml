services:
  # ==============================================================================
  # 1. EVOLUTION API (Integração WhatsApp Baileys)
  # ==============================================================================
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_internal_network
    depends_on:
      evolution-postgres:
        condition: service_healthy

  # ==============================================================================
  # 2. BANCO DE DADOS POSTGRESQL (evolution_db + movy_db + movy_concierge_db)
  # ==============================================================================
  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    # blindado: escuta apenas em 127.0.0.1 do host para nunca ficar exposto na internet (0.0.0.0)
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution_db}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution_user}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_pass}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
      - ./docker/init-movy-db.sql:/docker-entrypoint-initdb.d/init-movy-db.sql
    networks:
      - evolution_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution_user} -d ${EVOLUTION_DB_NAME:-evolution_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 3. MOVY BACKEND (API NestJS & SDR Lead Engine)
  # ==============================================================================
  movy-backend:
    container_name: movy_backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${EVOLUTION_DB_USER:-evolution_user}:${EVOLUTION_DB_PASSWORD:-evolution_pass}@evolution-postgres:5432/movy_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-movy_super_secret_jwt_key_2026_delivery}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY:-movy_secret_key_whatsapp_2026}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-bot movy}
      WHATSAPP_GROUP_JID: ${WHATSAPP_GROUP_JID:-120363413821500503@g.us}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@movy.com.br}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-movyAdmin2026!}
      META_ENCRYPTION_KEY: ${META_ENCRYPTION_KEY:-87fda1b51f69ce6a8ce119f34f44eabc1db6e2c7dc5f41f12369622795be6574}
      AGENCY_META_ACCOUNT_ID: ${AGENCY_META_ACCOUNT_ID:-}
      AGENCY_META_ACCESS_TOKEN: ${AGENCY_META_ACCESS_TOKEN:-${META_ACCESS_TOKEN:-}}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-${AGENCY_META_ACCESS_TOKEN:-}}
      FRONTEND_URL: ${FRONTEND_URL:-https://system.assessoriamovy.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://assessoriamovy.com,https://www.assessoriamovy.com,https://system.assessoriamovy.com,http://localhost:3000,http://localhost:8081}
      CONCIERGE_API_URL: http://movy-concierge-api:3002/api/v1
      CONCIERGE_INTERNAL_API_KEY: ${CONCIERGE_INTERNAL_API_KEY:-movy_s2s_concierge_internal_secret_2026}
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    networks:
      - evolution_internal_network

  # ==============================================================================
  # 3.1 CONCIERGE REDIS (Blindado: Rede Interna + Autenticação + Comandos Perigosos Desativados)
  # ==============================================================================
  concierge-redis:
    container_name: movy_concierge_redis
    image: redis:7-alpine
    restart: always
    # Sem 'ports:' expostos para fora do Docker! Apenas movy-concierge-api acessa via rede interna.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-movy_redis_prod_shield_2026_x9K2mP8qL4vR}"
      - "--rename-command"
      - "FLUSHALL"
      - ""
      - "--rename-command"
      - "FLUSHDB"
      - ""
      - "--rename-command"
      - "CONFIG"
      - ""
      - "--rename-command"
      - "EVAL"
      - ""
    volumes:
      - concierge_redis_data:/data
    networks:
      - evolution_internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-movy_redis_prod_shield_2026_x9K2mP8qL4vR}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # 3.2 MOVY AI CONCIERGE API (Microserviço Isolado Multi-Tenant para Deliveries)
  # ==============================================================================
  movy-concierge-api:
    container_name: movy_concierge_api
    build:
      context: ./apps/concierge-api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      PORT: 3002
      CONCIERGE_DATABASE_URL: postgresql://${EVOLUTION_DB_USER:-evolution_user}:${EVOLUTION_DB_PASSWORD:-evolution_pass}@evolution-postgres:5432/movy_concierge_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-movy_redis_prod_shield_2026_x9K2mP8qL4vR}@concierge-redis:6379
      CONCIERGE_JWT_SECRET: ${CONCIERGE_JWT_SECRET:-movy_concierge_tenant_jwt_secret_2026_hardened}
      CONCIERGE_INTERNAL_API_KEY: ${CONCIERGE_INTERNAL_API_KEY:-movy_s2s_concierge_internal_secret_2026}
      CONCIERGE_ENCRYPTION_KEY: ${CONCIERGE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://assessoriamovy.com,https://www.assessoriamovy.com,https://system.assessoriamovy.com,http://localhost:3000,http://localhost:3003}
    depends_on:
      evolution-postgres:
        condition: service_healthy
      concierge-redis:
        condition: service_healthy
    networks:
      - evolution_internal_network

  # ==============================================================================
  # 4. MOVY FRONTEND (Painel Next.js App Router - system.assessoriamovy.com)
  # ==============================================================================
  movy-frontend:
    container_name: movy_frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.assessoriamovy.com/api}
        NEXT_PUBLIC_CONCIERGE_API_URL: ${NEXT_PUBLIC_CONCIERGE_API_URL:-https://api.assessoriamovy.com/api/v1}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      INTERNAL_API_URL: http://movy-backend:3001/api
    depends_on:
      - movy-backend
    networks:
      - evolution_internal_network

  # ==============================================================================
  # 5. MOVY LANDING PAGE (Nginx Alpine - Porta 8081 - assessoriamovy.com)
  # ==============================================================================
  movy-landing-page:
    container_name: movy_landing_page
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - movy-backend
    networks:
      - evolution_internal_network

networks:
  evolution_internal_network:
    name: evolution_internal_network

volumes:
  evolution_instances:
    name: evolution_instances
  evolution_postgres_data:
    name: evolution_postgres_data
  concierge_redis_data:
    name: concierge_redis_data
