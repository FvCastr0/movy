services:
  # ==============================================================================
  # 1. EVOLUTION API (Integração WhatsApp Baileys)
  # ==============================================================================
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_internal_network
    depends_on:
      evolution-postgres:
        condition: service_healthy

  # ==============================================================================
  # 2. BANCO DE DADOS POSTGRESQL (evolution_db + movy_db)
  # ==============================================================================
  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution_db}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution_user}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_pass}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
      - ./docker/init-movy-db.sql:/docker-entrypoint-initdb.d/init-movy-db.sql
    networks:
      - evolution_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution_user} -d ${EVOLUTION_DB_NAME:-evolution_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 3. MOVY BACKEND (API NestJS & SDR Lead Engine)
  # ==============================================================================
  movy-backend:
    container_name: movy_backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${EVOLUTION_DB_USER:-evolution_user}:${EVOLUTION_DB_PASSWORD:-evolution_pass}@evolution-postgres:5432/movy_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-movy_super_secret_jwt_key_2026_delivery}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY:-movy_secret_key_whatsapp_2026}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-bot movy}
      WHATSAPP_GROUP_JID: ${WHATSAPP_GROUP_JID:-120363413821500503@g.us}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@movy.com.br}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-movyAdmin2026!}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    networks:
      - evolution_internal_network

  # ==============================================================================
  # 4. MOVY FRONTEND (Painel Next.js App Router)
  # ==============================================================================
  movy-frontend:
    container_name: movy_frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - movy-backend
    networks:
      - evolution_internal_network

  # ==============================================================================
  # 5. MOVY LANDING PAGE (Nginx Alpine - Porta 8081)
  # ==============================================================================
  movy-landing-page:
    container_name: movy_landing_page
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - movy-backend
    networks:
      - evolution_internal_network

networks:
  evolution_internal_network:
    name: evolution_internal_network

volumes:
  evolution_instances:
    name: evolution_instances
  evolution_postgres_data:
    name: evolution_postgres_data
