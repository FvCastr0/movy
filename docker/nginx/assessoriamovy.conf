# ==============================================================================
# MOVY PRODUCTION REVERSE PROXY - NGINX CONFIGURATION
# Domínios Oficiais:
#   1. assessoriamovy.com / www.assessoriamovy.com -> Landing Page (:8081)
#   2. system.assessoriamovy.com                  -> Painel Next.js (:3000)
#   3. api.assessoriamovy.com                     -> Backend (:3001) & Concierge (:3002)
#   4. evo.assessoriamovy.com                     -> Evolution API & Manager QR Code (:8080)
#
# Como ativar no servidor Ubuntu/Debian:
#   sudo cp docker/nginx/assessoriamovy.conf /etc/nginx/sites-available/assessoriamovy.conf
#   sudo ln -sf /etc/nginx/sites-available/assessoriamovy.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d assessoriamovy.com -d www.assessoriamovy.com -d system.assessoriamovy.com -d api.assessoriamovy.com -d evo.assessoriamovy.com
# ==============================================================================

# ==============================================================================
# ZONAS DE RATE LIMITING (Proteção contra DDoS, Flood de Leads e Brute-Force)
# ==============================================================================
limit_req_zone $binary_remote_addr zone=movy_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=movy_lead_capture_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=movy_evo_limit:10m rate=10r/s;

# ==============================================================================
# UPSTREAMS (Apontando para os containers expostos apenas em 127.0.0.1)
# ==============================================================================
upstream movy_landing {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream movy_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream movy_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream movy_concierge {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream movy_evolution {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ==============================================================================
# 1. LANDING PAGE (assessoriamovy.com e www.assessoriamovy.com -> Porta 8081)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name assessoriamovy.com www.assessoriamovy.com;

    server_tokens off;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fallback: Caso alguma chamada bata em assessoriamovy.com/api/, redireciona ao backend
    location /api/ {
        limit_req zone=movy_api_limit burst=20 nodelay;

        proxy_pass http://movy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Rota padrão -> Entrega a Landing Page (container na porta 8081)
    location / {
        proxy_pass http://movy_landing;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ==============================================================================
# 2. SUBDOMÍNIO DO SISTEMA (system.assessoriamovy.com -> Next.js Porta 3000)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name system.assessoriamovy.com;

    server_tokens off;
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Painel Frontend Next.js (Porta 3000)
    location / {
        proxy_pass http://movy_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==============================================================================
# 3. SUBDOMÍNIO DA API (api.assessoriamovy.com -> Backend :3001 + Concierge :3002)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.assessoriamovy.com;

    server_tokens off;
    client_max_body_size 25M;

    # Proteção anti-flood dedicada para o formulário de captura de leads da Landing Page
    location = /api/leads/capture {
        limit_req zone=movy_lead_capture_limit burst=5 nodelay;

        proxy_pass http://movy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Rota 1: Microserviço Concierge AI (/api/v1/* -> porta 3002)
    # Como o movy-concierge-api usa globalPrefix('api/v1') e o movy-backend usa ('api'),
    # o Nginx avalia '/api/v1/' (mais específico) ANTES de '/api/'!
    location /api/v1/ {
        limit_req zone=movy_api_limit burst=30 nodelay;

        proxy_pass http://movy_concierge;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets / Server-Sent Events (SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Rota 2: Backend Principal CRM/SDR (/api/* -> porta 3001)
    location /api/ {
        limit_req zone=movy_api_limit burst=30 nodelay;

        proxy_pass http://movy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets (Socket.io / notificações em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rota 3: Arquivos estáticos públicos gerados pelo backend (ex: relatórios PDF em /public)
    location /reports/ {
        proxy_pass http://movy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ==============================================================================
# 4. SUBDOMÍNIO EVOLUTION API (evo.assessoriamovy.com -> Porta 8080)
#    Permite acesso externo ao Manager (/manager) para conectar o WhatsApp (QR Code)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name evo.assessoriamovy.com;

    server_tokens off;
    # Evolution API precisa de body maior para envio de mídia/PDFs via WhatsApp
    client_max_body_size 50M;

    location / {
        limit_req zone=movy_evo_limit burst=30 nodelay;

        proxy_pass http://movy_evolution;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Obrigatório para o Manager da Evolution API atualizar o QR Code via WebSocket!
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
