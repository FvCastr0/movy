# ==============================================================================
# MOVY PRODUCTION REVERSE PROXY - NGINX CONFIGURATION
# Domínios:
#   1. assessoriamovy.com / www.assessoriamovy.com -> Landing Page (:8081)
#   2. system.assessoriamovy.com                  -> Painel Next.js (:3000)
#   3. api.assessoriamovy.com                     -> Backend (:3001) & Concierge (:3002)
#
# Como instalar no servidor Ubuntu/Debian:
#   sudo cp docker/nginx/assessoriamovy.conf /etc/nginx/sites-available/assessoriamovy.conf
#   sudo ln -sf /etc/nginx/sites-available/assessoriamovy.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d assessoriamovy.com -d www.assessoriamovy.com -d system.assessoriamovy.com -d api.assessoriamovy.com
# ==============================================================================

# Zonas de Rate Limit em memória compartilhada (proteção anti-DDoS e anti-BruteForce)
limit_req_zone $binary_remote_addr zone=movy_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=movy_lead_capture_limit:10m rate=2r/s;

# ==============================================================================
# UPSTREAMS LOCAIS (Conectam exclusivamente em 127.0.0.1 blindado no Docker)
# ==============================================================================
upstream movy_landing_upstream {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream movy_system_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream movy_backend_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream movy_concierge_upstream {
    server 127.0.0.1:3002;
    keepalive 32;
}

# ==============================================================================
# 1. LANDING PAGE OFICIAL (assessoriamovy.com e www.assessoriamovy.com)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name assessoriamovy.com www.assessoriamovy.com;

    server_tokens off;
    client_max_body_size 5M;

    # Cabeçalhos extras de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://movy_landing_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ==============================================================================
# 2. SISTEMA / PAINEL E PORTAL DE DELIVERY (system.assessoriamovy.com)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name system.assessoriamovy.com;

    server_tokens off;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://movy_system_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte para Next.js HMR / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==============================================================================
# 3. API GATEWAY UNIFICADO (api.assessoriamovy.com)
#    - /api/v1/* -> Microserviço AI Concierge (:3002)
#    - /api/*    -> Backend Principal CRM/SDR (:3001)
#    - /reports/*-> Arquivos estáticos de relatórios PDF (:3001)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.assessoriamovy.com;

    server_tokens off;
    client_max_body_size 25M;

    # Proteção especial contra flood no formulário público de captura de leads
    location = /api/leads/capture {
        limit_req zone=movy_lead_capture_limit burst=5 nodelay;

        proxy_pass http://movy_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Rota 1: Microserviço AI Concierge & Webhooks Meta (/api/v1/* -> porta 3002)
    location /api/v1/ {
        limit_req zone=movy_api_limit burst=40 nodelay;

        proxy_pass http://movy_concierge_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a conexões persistentes / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Rota 2: Backend Principal CRM, Clientes, Financeiro e Relatórios (/api/* -> porta 3001)
    location /api/ {
        limit_req zone=movy_api_limit burst=40 nodelay;

        proxy_pass http://movy_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rota 3: Download de PDFs públicos gerados pelo Backend
    location /reports/ {
        proxy_pass http://movy_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
